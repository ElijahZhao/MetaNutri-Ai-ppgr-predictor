name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    name: Demo (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # numpy 2.5 / pandas 3 pin Python >=3.12 (see requirements.txt).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Boots app.py headlessly with Streamlit's AppTest harness (no server, no
      # network) and asserts the three scalar predictions and the TreeSHAP panel
      # render. This is the exact command documented in the README.
      - name: Smoke test (AppTest)
        run: python test_app.py

  sync:
    name: Sync (parent module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Compares the curated copies with the parent repository by git blob SHA.
      # The token keeps the single API request well clear of the 60/hour
      # unauthenticated limit that shared runner IPs can exhaust.
      - name: Compare curated files with the parent repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_sync.py
